name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk EloRhytm16.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EloRhytm16-apk
          path: EloRhytm16.apk

      - name: Publish as the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest EloRhytm16.apk \
            --title "EloRhytm16 (latest build)" \
            --notes "Built from ${GITHUB_SHA::7}. Open this page on your phone and tap EloRhytm16.apk to install." \
            --target "$GITHUB_SHA"
